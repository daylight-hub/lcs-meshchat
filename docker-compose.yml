services:
  lcs-meshchat:
    container_name: lcs-meshchat
    image: ghcr.io/daylight-hub/lcs-meshchat:latest
    pull_policy: always
    restart: unless-stopped
    # Tells the app it is containerised, so it uses the browser audio bridge
    # instead of looking for audio hardware it does not have. Leave it set.
    environment:
      - LCS_DOCKER=1
    # Make the web interface accessible from the host on port 8000
    ports:
      - 0.0.0.0:8000:8000
    volumes:
      - meshchat-config:/config
    # Uncomment if you have a USB device connected, such as an RNode
    # devices:
    #   - /dev/ttyUSB0:/dev/ttyUSB0

volumes:
    meshchat-config:
