name: Manual Docker build (fork)

on:
  workflow_dispatch:

jobs:
  build_docker:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Clone Repo
        uses: actions/checkout@v4

      # ghcr image names must be lowercase; derive it from the fork owner.
      - name: Compute image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/lcs-meshchat" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker images
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # Fixed tags — no slash-containing ref_name, so this works on any branch.
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:lxst
          labels: |
            org.opencontainers.image.title=Reticulum MeshChat
            org.opencontainers.image.description=Docker image for Reticulum MeshChat (rns 1.3.5 / lxmf 1.0.1 / lxst 0.4.8)
