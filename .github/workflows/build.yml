name: Build and Release (LCS)

on:
  push:
    branches:
      - lcs
      - "2.0.9"   # 2.0.9 and later (LCS Global, Tor)
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      make_release:
        description: "Also build desktop apps + create a release"
        type: boolean
        default: false
      release_tag:
        description: "Release tag for desktop apps (e.g. v1.1.0)"
        type: string
        required: false

# one place to compute the release tag so every desktop job attaches to the
# SAME release (avoids multiple draft releases)
env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:

  build_docker:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history and tags, so release notes can list commits since the last tag
      - name: Compute lowercase image name and version
        id: img
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/lcs-meshchat" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker images
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # :latest always follows the newest line (the 2.0.9 branch); every build also gets its
          # version number, so older versions stay available (e.g. :2.1.0)
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ steps.img.outputs.version }}
          labels: |
            org.opencontainers.image.title=LCS MeshChat
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  build_windows:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.make_release)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history and tags, so release notes can list commits since the last tag
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python Deps
        run: pip install -r requirements.txt
      - name: Install NodeJS Deps
        run: npm install
      - name: Fetch and verify Tor
        shell: bash
        run: python tools/tor/fetch_tor.py
      - name: Build Electron App
        run: npm run dist
      - name: Generate release notes
        shell: bash
        run: python .github/scripts/release_notes.py "${{ env.RELEASE_TAG }}" --output RELEASE_NOTES.md

      - name: Create / update Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.RELEASE_TAG }}
          draft: true
          allowUpdates: true
          replacesArtifacts: true
          omitDraftDuringUpdate: true
          omitNameDuringUpdate: true
          bodyFile: RELEASE_NOTES.md
          artifacts: "dist/*-win-installer.exe,dist/*-win-portable.exe"

  build_mac:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.make_release)
    strategy:
      fail-fast: false   # one Mac build failing shouldn't cancel the other
      matrix:
        os: [ macos-15, macos-15-intel ]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history and tags, so release notes can list commits since the last tag
      # pycodec2 (via lxst) compiles a C extension that needs the codec2
      # headers/library. install them with Homebrew and point the compiler at them.
      - name: Install codec2 (for pycodec2)
        run: |
          brew install codec2 pkg-config
          echo "CFLAGS=-I$(brew --prefix)/include" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$(brew --prefix)/lib" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python Deps
        run: pip install -r requirements.txt
      - name: Install NodeJS Deps
        run: npm install
      - name: Fetch and verify Tor
        run: |
          brew install gnupg
          python tools/tor/fetch_tor.py
      - name: Build Electron App (with DMG-eject retry)
        run: |
          attempt=1
          max=3
          until npm run dist; do
            status=$?
            if [ $attempt -ge $max ]; then
              echo "npm run dist failed after $attempt attempts"
              exit $status
            fi
            echo "Build attempt $attempt failed (likely DMG eject race). Retrying in 15s..."
            hdiutil detach -force /Volumes/*MeshChat* 2>/dev/null || true
            sleep 15
            attempt=$((attempt+1))
          done
      - name: Generate release notes
        shell: bash
        run: python .github/scripts/release_notes.py "${{ env.RELEASE_TAG }}" --output RELEASE_NOTES.md

      - name: Create / update Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.RELEASE_TAG }}
          draft: true
          allowUpdates: true
          replacesArtifacts: true
          omitDraftDuringUpdate: true
          omitNameDuringUpdate: true
          bodyFile: RELEASE_NOTES.md
          artifacts: "dist/*-mac-*.dmg"

  build_linux:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.make_release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history and tags, so release notes can list commits since the last tag
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python Deps
        run: pip install -r requirements.txt
      - name: Install NodeJS Deps
        run: npm install
      - name: Fetch and verify Tor
        shell: bash
        run: python tools/tor/fetch_tor.py
      - name: Build Electron App
        run: npm run dist
      - name: Generate release notes
        shell: bash
        run: python .github/scripts/release_notes.py "${{ env.RELEASE_TAG }}" --output RELEASE_NOTES.md

      - name: Create / update Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.RELEASE_TAG }}
          draft: true
          allowUpdates: true
          replacesArtifacts: true
          omitDraftDuringUpdate: true
          omitNameDuringUpdate: true
          bodyFile: RELEASE_NOTES.md
          artifacts: "dist/*-linux.AppImage"
